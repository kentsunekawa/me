# ── 職務要約 ──────────────────────────────
summary: |
  2016 年より約 10 年、Web 業界でキャリアを積んできました。Web デザイナー・コーダーとして
  Web 制作に従事した後、2021 年より Web アプリケーション開発へ軸足を移し、フロントエンド
  エンジニア／フロントエンドチームリーダーとして、医療・自治体・官公庁・人材など多様な
  ドメインの新規プロダクト立ち上げに携わってきました。フロントエンドを主軸に UX/UI 設計から
  実装までを一貫して担い、近年は AI を活用しながら設計・バックエンド領域へと範囲を広げて
  います。不確定な状況でも関係者と議論しながら開発を前に進め、ゼロからの新規構築を任される
  ことが多いのが強みです。

