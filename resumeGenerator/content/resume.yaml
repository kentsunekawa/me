# ── 自己 PR（項目立て）────────────────────────
# 各セクションは title を持ち、配下に items（小見出し付き）か body（散文）のどちらかを持つ。
pr:
  - title: 強み・特性
    items:
      - title: アプリケーション開発を進める力
        body: 不確定要素の多い状況でも、関係各所と議論しながら一つずつ物事を決めて前に進めます。新規構築では何が必要かを自ら定義し、スケジュールを引いて逆算しながら開発を推進。タスクの割り振りや進捗管理も担い、立ち上げ段階からの参画やゼロからの新規構築を任されることが多くあります。
      - title: デザイン・UX/UI のバックグラウンド
        body: グラフィック／Web デザインの経験を土台に、エンジニア視点とデザイン視点の両面から改善提案ができます。デザインのない中での実装やデザイナーの意図を汲んだ実装、要件からの画面設計・ワイヤーフレーム作成も担当。近年はデザインシステム設計や、Figma と AI エージェントを MCP で繋いだ実装の高速化など、デザインと開発フローの整備も手がけました。
      - title: 物事を構造で捉える力
        body: 一つに見えるものが別々の役割を抱えていたり、切り離せるものが余計に結合していたりする箇所に気づき、要素を分けて整理し直します。たとえば「友達紹介キャンペーン」の設計レビューでは、汎用的なキャンペーン／単独で成り立つ友達紹介／両者を紐づける友達紹介キャンペーンの 3 つに分解する構造を提案し、そのまま採用・実装されました。
  - title: 今後の展望
    body: AI により実装のハードルが下がる時代において、価値の中心は「何をどう作るか」を決める設計・意思決定へ移ると考えています。設計は実装を伴ってこそ意味を持つため、現在は個人開発でバックエンドを書きながら API・データベースの設計・実装を習得中。特定の領域に閉じず、UX から逆算した設計から実装までを一貫して担い、プロダクトの意思決定を担えるエンジニアを目指しています。
